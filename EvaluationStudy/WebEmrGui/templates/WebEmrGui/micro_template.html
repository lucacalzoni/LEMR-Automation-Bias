{% load custom_tags %}
<div class="contents tab-pane" id={{ div_id }}>
    <div class="tabbable">

         <div class="tab-content col-md-12 dropdown scroll-box"><p></p>
        <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown" style="background-color:#e8e8e8">
            Switch note <span class="caret"></span>
        </button>
         <ul class="dropdown-menu m_h">
            {% for report in report_dict %}
                {% if forloop.first %}
                    <a href="#{{ div_id }}-{{ forloop.counter0 }}-{{ report.upk }}" data-toggle="tab">
                        <button class="v-button red-text" onclick="setColor(this)">{{ report.date }}</button>
                        <button class="m-button" onclick="add_vertical_point.call(this, '{{ report.js_time }}', true)">
                            Mark date
                        </button>
                    </a>
                {% else %}
                    <a href="#{{ div_id }}-{{ forloop.counter0 }}-{{ report.upk }}" data-toggle="tab">
                        <button class="n-button" onclick="setColor(this)">{{ report.date }}</button>
                        <button class="m-button" onclick="add_vertical_point.call(this, '{{ report.js_time }}', true)">
                            Mark date
                        </button>
                    </a>
                {% endif %}
            {% endfor %}
        </ul>

        </div>

        <div class="tab-content col-md-12 scroll-box" id="note_scroll_{{ div_id }}">
            {% for report in report_dict %}
                {% autoescape off %}
                    <div class="tab-pane report {% if forloop.counter0 == 0 %} active {% endif %}"
                         id="{{ div_id }}-{{ forloop.counter0 }}-{{ report.upk }}"><p></p>{{ report.text }}</div>
                {% endautoescape %}
            {% endfor %}
        </div>
    </div>
</div>

<script>
(function(){
    var scope = document.getElementById('note_scroll_{{ div_id }}');
    if (!scope || scope.dataset.tabsBound === '1') return;
    scope.dataset.tabsBound = '1';
    // Find the sibling dropdown-menu that contains this section's tabs
    var menu = scope.parentNode.querySelector('.dropdown-menu');
    if (!menu) return;
    menu.addEventListener('click', function(ev){
        // Walk up to find the <a data-toggle="tab" href="#..."> ancestor
        var a = ev.target;
        while (a && a !== menu && !(a.getAttribute && a.getAttribute('data-toggle') === 'tab')) {
            a = a.parentNode;
        }
        if (!a || a === menu) return;
        var href = a.getAttribute('href');
        if (!href || href.charAt(0) !== '#') return;
        var target = document.getElementById(href.slice(1));
        if (!target) return;
        // Hide all siblings, show target
        var siblings = scope.querySelectorAll('.tab-pane');
        for (var i = 0; i < siblings.length; i++) {
            siblings[i].classList.remove('active');
        }
        target.classList.add('active');
        // Update the dropdown button label to the picked entry's first button text
        var btn = a.querySelector('button');
        if (btn) {
            var toggle = scope.parentNode.querySelector('.dropdown-toggle');
            if (toggle) {
                toggle.firstChild && (toggle.firstChild.nodeValue = btn.textContent.trim() + ' ');
            }
        }
        ev.preventDefault();
    });
})();
</script>
