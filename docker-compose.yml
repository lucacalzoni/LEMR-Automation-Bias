services:
  lemr:
    build: .
    image: lemr:local
    container_name: lemr
    ports:
      - "8000:8000"
    environment:
      # DJANGO_SECRET_KEY: "<set-a-long-random-string-for-anything-but-local-dev>"
      # DJANGO_ALLOWED_HOSTS: ""
      PYTHONUNBUFFERED: "1"
    volumes:
      # Live code mount — edits to Python/templates/CSS/JS on the host are
      # picked up on the next request (Django auto-reloads .py files; static
      # files and templates are re-read per request). No `--build` needed
      # for iteration. Comment this out if you want the immutable
      # image-baked behaviour for a reproducibility snapshot.
      - ./EvaluationStudy:/app/EvaluationStudy
